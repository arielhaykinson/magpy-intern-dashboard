services:
  - type: web
    name: magpy-intern-dashboard
    runtime: node
    plan: starter
    buildCommand: "echo no build"
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /data
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
    disk:
      name: magpy-data
      mountPath: /data
      sizeGB: 1
