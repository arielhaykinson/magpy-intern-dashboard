<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Solavant</title><meta name="theme-color" content="#000000"><meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="/solavant-logo.jpg">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Fraunces;src:url(/fonts/fraunces.ttf) format("truetype");font-weight:400 500;font-display:swap}
:root{--cu:#c98a55;--sand:#e8c4a2;--mut:#8a7d70;--line:#2a221c;--card:#0d0b09}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--sand);font:15px/1.6 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.logo{width:min(300px,70vw);height:auto;display:block;margin-bottom:28px}
.card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:28px 26px;text-align:center}
h1{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:24px}
p{margin:0 0 22px;color:var(--mut);font-size:14px}
.g{display:inline-flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--cu);color:var(--sand);text-decoration:none;font-weight:500;transition:background .2s}
.g:hover,.g:focus-visible{background:rgba(201,138,85,.12);outline:none}
.g svg{width:18px;height:18px}
.msg{margin:18px 0 0;font-size:13px;color:#d7a27a;min-height:1em}
footer{margin-top:40px;color:#4d453d;font-size:12px}
</style></head><body><div class="wrap">
<img class="logo" src="/solavant-logo.jpg" width="797" height="414" alt="Solavant">
<div class="card"><h1>Welcome back</h1><p>Sign in with Google.</p>
<a class="g" id="go" href="/api/auth/login"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</a>
<div class="msg" id="msg" role="status"></div></div>
<footer>Solavant Capital Management</footer></div>
<script>
const q=new URLSearchParams(location.search),n=q.get("next");
if(n&&/^\/(?!\/)/.test(n))document.getElementById("go").href="/api/auth/login?next="+encodeURIComponent(n);
const M={notallowed:"That Google account isn't on the access list. Ask Ariel to add it.",cancelled:"Sign-in was cancelled.",state:"Your sign-in link expired. Please try again.",exchange:"Couldn't finish signing in with Google. Please try again.",token:"Google returned an unexpected response. Please try again."};
const e=q.get("error");document.getElementById("msg").textContent=e?(M[e]||"Sign-in failed."):(q.get("signedout")?"You're signed out.":"");
</script></body></html>
